#
# WARNING: Make sure to use the docker-compose.yml of the current release:
#
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# The compose file on main may not be compatible with the latest release.
#
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    profiles:
      - apps
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - ${DIR_CLOUD_ROOT}/${CLOUD_USER}/Library/Photos:/usr/src/app/upload
      - ${DIR_CLOUD_ROOT}/${CLOUD_USER}/Library/import:/data/import
      - ../config/immich/immich-config.json:/immich-config.json
      - /etc/localtime:/etc/localtime:ro
    user: 1000:1000
    environment:
      UPLOAD_LOCATION: ${DIR_CLOUD_ROOT}/${CLOUD_USER}/Library/Photos
      DB_DATA_LOCATION: ${DIR_DATA_ROOT}/immich/postgres
      IMMICH_VERSION: ${IMMICH_VERSION}
      IMMICH_CONFIG_FILE: /immich-config.json
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USERNAME: ${DB_USERNAME}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME}
      TZ: ${TZ}
    depends_on:
      - redis
      - database
    networks:
      klack:      
    restart: always
    healthcheck:
      disable: false
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.immich.rule=PathPrefix(`/`)"
      - "traefik.http.routers.immich.tls.certresolver=myresolver"
      - "traefik.http.routers.immich.entrypoints=immich"
      - "traefik.http.routers.immich.service=immich"
      - "traefik.http.services.immich.loadBalancer.server.port=2283"
      - "stack=klack.cloud"

  immich-machine-learning:
    # For hardware acceleration, add one of -[armnn, cuda, openvino] to the image tag.
    # Example tag: ${IMMICH_VERSION:-release}-cuda
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    profiles:
      - apps      
    # extends: # uncomment this section for hardware acceleration - see https://immich.app/docs/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, openvino, openvino-wsl] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    volumes:
      - model-cache:/cache
    # env_file:
    #   - .env
    environment:
      UPLOAD_LOCATION: ${DIR_CLOUD_ROOT}/${CLOUD_USER}/Photos
      DB_DATA_LOCATION: ${DIR_DATA_ROOT}/immich/postgres
      IMMICH_VERSION: ${IMMICH_VERSION}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USERNAME: ${DB_USERNAME}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME}
      TZ: ${TZ}
    networks:
      klack:      
    restart: always
    healthcheck:
      disable: false

  redis:
    image: docker.io/redis:6.2-alpine@sha256:2d1463258f2764328496376f5d965f20c6a67f66ea2b06dc42af351f75248792
    networks:
      klack:      
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      TZ: ${TZ}
    user: 1000:1000
    shm_size: 128mb
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - ${DIR_DATA_ROOT}/immich/postgres:/var/lib/postgresql/data
    networks:
      klack:
    restart: always

volumes:
  model-cache:
